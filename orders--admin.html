<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="assets/Logo.png" />
    <link rel="stylesheet" href="https://unpkg.com/swiper@8/swiper-bundle.min.css" />
    <link rel="stylesheet" href="admin.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&family=Oswald:wght@200..700&display=swap');
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Chick Chicken - Orders</title>

    <style>
        /* ── Toolbar ── */
        .orders-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }
        .orders-toolbar input[type="text"] {
            flex: 1;
            min-width: 200px;
            padding: 9px 14px;
            border: 1.5px solid #e5e5e5;
            border-radius: 8px;
            font-family: 'Alegreya Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color .2s;
        }
        .orders-toolbar input[type="text"]:focus {
            border-color: #f5c800;
        }
        .orders-toolbar select {
            padding: 9px 14px;
            border: 1.5px solid #e5e5e5;
            border-radius: 8px;
            font-family: 'Alegreya Sans', sans-serif;
            font-size: 14px;
            background: #fff;
            outline: none;
            cursor: pointer;
            transition: border-color .2s;
        }
        .orders-toolbar select:focus {
            border-color: #f5c800;
        }
        .btn-refresh {
            padding: 9px 18px;
            background: #f5c800;
            border: none;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: .5px;
            cursor: pointer;
            transition: background .2s, transform .1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-refresh:hover  { background: #e0b300; }
        .btn-refresh:active { transform: scale(.97); }

        /* ── Table ── */
        .orders-table-wrap {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 2px 16px rgba(0,0,0,.07);
            overflow: hidden;
        }
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Alegreya Sans', sans-serif;
            font-size: 14px;
        }
        .orders-table thead tr {
            background: #1a1a1a;
            color: #f5c800;
        }
        .orders-table thead th {
            padding: 13px 16px;
            font-family: 'Oswald', sans-serif;
            font-weight: 500;
            letter-spacing: .6px;
            font-size: 13px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .orders-table tbody tr {
            border-bottom: 1px solid #f4f4f4;
            cursor: pointer;
            transition: background .15s;
        }
        .orders-table tbody tr:last-child { border-bottom: none; }
        .orders-table tbody tr:hover { background: #fffbea; }
        .orders-table tbody td {
            padding: 12px 16px;
            vertical-align: middle;
        }
        .order-id-cell {
            font-family: 'Oswald', sans-serif;
            font-weight: 600;
            color: #222;
            font-size: 15px;
        }
        .customer-name { font-weight: 700; color: #222; }
        .customer-sub  { font-size: 12px; color: #999; margin-top: 2px; }
        .branch-cell   { font-size: 13px; color: #555; max-width: 180px; }
        .payment-badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .pay-online { background: #e3f2fd; color: #1565c0; }
        .pay-cod    { background: #f3e5f5; color: #6a1b9a; }

        .order-status {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: capitalize;
            display: inline-block;
        }
        .status-pending   { background: #fff8e1; color: #e65c00; }
        .status-confirmed { background: #e8f5e9; color: #2e7d32; }
        .status-cancelled { background: #fce4ec; color: #c62828; }

        /* ── Skeleton ── */
        .skeleton {
            display: inline-block;
            background: linear-gradient(90deg, #e0e0e0 25%, #f5f5f5 50%, #e0e0e0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.2s infinite;
            border-radius: 4px;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-row td { padding: 14px 16px; }

        /* ── Pagination ── */
        .pagination-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-top: 1px solid #f0f0f0;
            font-family: 'Alegreya Sans', sans-serif;
            font-size: 13px;
            color: #888;
            flex-wrap: wrap;
            gap: 8px;
        }
        .pagination-btns { display: flex; gap: 6px; }
        .page-btn {
            padding: 5px 12px;
            border: 1.5px solid #e5e5e5;
            border-radius: 6px;
            background: #fff;
            font-family: 'Oswald', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all .15s;
        }
        .page-btn:hover:not(:disabled) { border-color: #f5c800; background: #fffbea; }
        .page-btn.active { background: #f5c800; border-color: #f5c800; font-weight: 700; }
        .page-btn:disabled { opacity: .4; cursor: default; }

        /* ── Empty / Error ── */
        .table-empty {
            text-align: center;
            padding: 48px 20px;
            color: #bbb;
            font-family: 'Oswald', sans-serif;
            font-size: 16px;
            letter-spacing: .5px;
        }
        .table-empty ion-icon { font-size: 36px; display: block; margin-bottom: 10px; }

        /* ── Modal ── */
        .modal-header {
            background: #1a1a1a;
            color: #f5c800;
            border-bottom: none;
            border-radius: 12px 12px 0 0;
        }
        .modal-header .btn-close { filter: invert(1); opacity: .7; }
        .modal-content { border-radius: 12px; border: none; box-shadow: 0 8px 40px rgba(0,0,0,.18); }
        .modal-title { font-family: 'Oswald', sans-serif; font-size: 20px; letter-spacing: .5px; }

        .order-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
            margin-bottom: 20px;
        }
        .meta-item label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: #aaa;
            display: block;
            margin-bottom: 2px;
        }
        .meta-item span {
            font-family: 'Alegreya Sans', sans-serif;
            font-size: 14px;
            color: #222;
            font-weight: 500;
        }

        .items-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Alegreya Sans', sans-serif;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .items-table thead th {
            background: #f7f7f7;
            padding: 8px 12px;
            font-family: 'Oswald', sans-serif;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: #555;
            border-bottom: 1px solid #eee;
        }
        .items-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid #f4f4f4;
            vertical-align: middle;
        }
        .items-table tbody tr:last-child td { border-bottom: none; }
        .item-img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 6px;
            background: #f0f0f0;
        }
        .item-name { font-weight: 700; color: #222; }
        .item-opts { font-size: 11px; color: #999; margin-top: 2px; }

        .order-total-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 10px 0 0;
            border-top: 2px solid #f0f0f0;
            font-family: 'Oswald', sans-serif;
        }
        .order-total-label { font-size: 14px; color: #888; letter-spacing: .5px; }
        .order-total-value { font-size: 22px; font-weight: 700; color: #1a1a1a; }

        .status-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
            flex-wrap: wrap;
        }
        .btn-confirm {
            padding: 8px 20px;
            background: #2e7d32;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: .4px;
            cursor: pointer;
            transition: background .2s, transform .1s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-confirm:hover  { background: #1b5e20; }
        .btn-confirm:active { transform: scale(.97); }

        .btn-cancel-order {
            padding: 8px 20px;
            background: #c62828;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: .4px;
            cursor: pointer;
            transition: background .2s, transform .1s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-cancel-order:hover  { background: #b71c1c; }
        .btn-cancel-order:active { transform: scale(.97); }

        .btn-pending-order {
            padding: 8px 20px;
            background: #e65c00;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 14px;
            letter-spacing: .4px;
            cursor: pointer;
            transition: background .2s, transform .1s;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-pending-order:hover  { background: #bf360c; }
        .btn-pending-order:active { transform: scale(.97); }

        .status-update-msg {
            font-size: 13px;
            font-family: 'Alegreya Sans', sans-serif;
            padding: 6px 12px;
            border-radius: 6px;
            display: none;
        }
        .status-update-msg.success { background: #e8f5e9; color: #2e7d32; display: inline-block; }
        .status-update-msg.error   { background: #fce4ec; color: #c62828; display: inline-block; }

        /* ── Toast ── */
        .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 9999; }
        .toast-msg {
            background: #1a1a1a;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            font-family: 'Alegreya Sans', sans-serif;
            font-size: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,.2);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideUp .3s ease;
            border-left: 4px solid #f5c800;
        }
        .toast-msg.error-toast { border-left-color: #c62828; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
<script src="https://unpkg.com/swiper@8/swiper-bundle.min.js"></script>
<script src="admin.js"></script>

<script>
const API = 'order.php';
let currentPage = 1;
let searchTimer = null;
let activeOrderId = null;
const modal = new bootstrap.Modal(document.getElementById('orderModal'));

// ── TOAST ────────────────────────────────────────────────
function toast(msg, isError = false) {
    const el = document.createElement('div');
    el.className = 'toast-msg' + (isError ? ' error-toast' : '');
    el.innerHTML = `<ion-icon name="${isError ? 'alert-circle-outline' : 'checkmark-circle-outline'}" style="font-size:18px;color:${isError?'#c62828':'#f5c800'}"></ion-icon> ${msg}`;
    document.getElementById('toastContainer').appendChild(el);
    setTimeout(() => el.remove(), 3200);
}

// ── FORMAT HELPERS ───────────────────────────────────────
const php = v => '₱' + Number(v).toLocaleString('en-PH', { minimumFractionDigits: 2 });
const padId = id => '#' + String(id).padStart(7, '0');
const fmtDate = s => new Date(s).toLocaleDateString('en-PH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });

function statusBadge(s) {
    return `<span class="order-status status-${s}">${s}</span>`;
}

// ── LOAD ORDERS TABLE ────────────────────────────────────
async function loadOrders(page = 1) {
    currentPage = page;
    const search = document.getElementById('searchInput').value.trim();
    const status = document.getElementById('statusFilter').value;
    const sort   = document.getElementById('sortOrder').value;

    const params = new URLSearchParams({ action: 'list', page, limit: 20, sort });
    if (search) params.set('search', search);
    if (status) params.set('status', status);

    // Show skeletons
    document.getElementById('ordersBody').innerHTML = [1,2,3,4,5].map(() => `
        <tr class="skeleton-row">
            ${[70,120,150,60,70,80,90].map(w => `<td><span class="skeleton" style="width:${w}px;height:15px;"></span></td>`).join('')}
        </tr>
    `).join('');
    document.getElementById('paginationBar').style.display = 'none';

    try {
        const res  = await fetch(`${API}?${params}`);
        const data = await res.json();

        if (data.error) { renderError(data.error); return; }

        renderRows(data.orders);
        renderPagination(data.page, data.total_pages, data.total, data.limit);
    } catch (e) {
        renderError('Could not reach orders.php — is XAMPP running?');
    }
}

function renderRows(orders) {
    const tbody = document.getElementById('ordersBody');
    if (!orders.length) {
        tbody.innerHTML = `
            <tr><td colspan="7">
                <div class="table-empty">
                    <ion-icon name="bag-handle-outline"></ion-icon>
                    No orders found
                </div>
            </td></tr>`;
        return;
    }
    tbody.innerHTML = orders.map(o => `
        <tr onclick="openOrder(${o.id})">
            <td class="order-id-cell">${padId(o.id)}</td>
            <td>
                <div class="customer-name">${escHtml(o.name)}</div>
                <div class="customer-sub">${escHtml(o.email || o.phone || '—')}</div>
            </td>
            <td class="branch-cell">${escHtml(o.branch || '—')}</td>
            <td><span class="payment-badge pay-${o.payment_method}">${o.payment_method === 'cod' ? 'COD' : 'Online'}</span></td>
            <td><strong>${php(o.total)}</strong></td>
            <td>${statusBadge(o.status)}</td>
            <td style="font-size:13px;color:#777;">${fmtDate(o.created_at)}</td>
        </tr>
    `).join('');
}

function renderPagination(page, totalPages, total, limit) {
    const bar  = document.getElementById('paginationBar');
    const info = document.getElementById('paginationInfo');
    const btns = document.getElementById('paginationBtns');

    const from = Math.min((page - 1) * limit + 1, total);
    const to   = Math.min(page * limit, total);
    info.textContent = total ? `Showing ${from}–${to} of ${total} orders` : 'No orders';

    // Build page buttons (max 7 shown)
    let pages = [];
    if (totalPages <= 7) {
        pages = Array.from({length: totalPages}, (_, i) => i + 1);
    } else {
        pages = [1];
        if (page > 3) pages.push('…');
        for (let p = Math.max(2, page-1); p <= Math.min(totalPages-1, page+1); p++) pages.push(p);
        if (page < totalPages - 2) pages.push('…');
        pages.push(totalPages);
    }

    btns.innerHTML = `
        <button class="page-btn" onclick="loadOrders(${page - 1})" ${page <= 1 ? 'disabled' : ''}>‹ Prev</button>
        ${pages.map(p => p === '…'
            ? `<span style="padding:5px 4px;color:#bbb;">…</span>`
            : `<button class="page-btn ${p === page ? 'active' : ''}" onclick="loadOrders(${p})">${p}</button>`
        ).join('')}
        <button class="page-btn" onclick="loadOrders(${page + 1})" ${page >= totalPages ? 'disabled' : ''}>Next ›</button>
    `;

    bar.style.display = 'flex';
}

function renderError(msg) {
    document.getElementById('ordersBody').innerHTML = `
        <tr><td colspan="7">
            <div class="table-empty" style="color:#c62828;">
                <ion-icon name="alert-circle-outline"></ion-icon>
                ${escHtml(msg)}
            </div>
        </td></tr>`;
}

// ── OPEN ORDER MODAL ─────────────────────────────────────
async function openOrder(id) {
    activeOrderId = id;
    document.getElementById('orderModalLabel').textContent = `Order ${padId(id)}`;
    document.getElementById('orderModalBody').innerHTML = `
        <div style="text-align:center;padding:40px;">
            <div class="spinner-border text-warning" role="status"></div>
        </div>`;
    modal.show();

    try {
        const res   = await fetch(`${API}?action=get&id=${id}`);
        const order = await res.json();
        if (order.error) { document.getElementById('orderModalBody').innerHTML = `<p class="text-danger">${order.error}</p>`; return; }
        renderModal(order);
    } catch (e) {
        document.getElementById('orderModalBody').innerHTML = `<p class="text-danger">Failed to load order.</p>`;
    }
}

function renderModal(o) {
    const itemsHtml = o.items.map(item => `
        <tr>
            <td>
                <img src="${escHtml(item.product_image || '')}" alt="" class="item-img"
                     onerror="this.src='assets/Logo.png'">
            </td>
            <td>
                <div class="item-name">${escHtml(item.product_name || 'Unknown')}</div>
                <div class="item-opts">
                    ${[item.option_selected, item.sauce, item.extra_flavor, item.mix_preference]
                        .filter(Boolean).join(' · ')}
                </div>
            </td>
            <td style="text-align:center;">${item.quantity}</td>
            <td style="text-align:right;">${php(item.price)}</td>
            <td style="text-align:right;font-weight:700;">${php(item.price * item.quantity)}</td>
        </tr>
    `).join('');

    document.getElementById('orderModalBody').innerHTML = `
        <div class="order-meta-grid">
            <div class="meta-item">
                <label>Customer</label>
                <span>${escHtml(o.name)}</span>
            </div>
            <div class="meta-item">
                <label>Status</label>
                <span id="modalStatusBadge">${statusBadge(o.status)}</span>
            </div>
            <div class="meta-item">
                <label>Phone</label>
                <span>${escHtml(o.phone || '—')}</span>
            </div>
            <div class="meta-item">
                <label>Email</label>
                <span>${escHtml(o.email || '—')}</span>
            </div>
            <div class="meta-item" style="grid-column:1/-1;">
                <label>Address</label>
                <span>${escHtml(o.address || '—')}</span>
            </div>
            <div class="meta-item">
                <label>Branch</label>
                <span>${escHtml(o.branch || '—')}</span>
            </div>
            <div class="meta-item">
                <label>Payment</label>
                <span><span class="payment-badge pay-${o.payment_method}">${o.payment_method === 'cod' ? 'Cash on Delivery' : 'Online'}</span></span>
            </div>
            <div class="meta-item">
                <label>Ordered At</label>
                <span>${fmtDate(o.created_at)}</span>
            </div>
            ${o.card_number ? `<div class="meta-item"><label>Card</label><span>•••• •••• •••• ${o.card_number.slice(-4)}</span></div>` : ''}
        </div>

        <h6 style="font-family:'Oswald',sans-serif;letter-spacing:.5px;color:#555;margin-bottom:10px;">ORDER ITEMS</h6>
        <table class="items-table">
            <thead>
                <tr>
                    <th style="width:50px;"></th>
                    <th>Item</th>
                    <th style="text-align:center;">Qty</th>
                    <th style="text-align:right;">Price</th>
                    <th style="text-align:right;">Subtotal</th>
                </tr>
            </thead>
            <tbody>${itemsHtml}</tbody>
        </table>

        <div class="order-total-row">
            <span class="order-total-label">TOTAL</span>
            <span class="order-total-value">${php(o.total)}</span>
        </div>

        <div class="status-actions">
            <button class="btn-confirm"       onclick="updateStatus(${o.id}, 'confirmed')">
                <ion-icon name="checkmark-circle-outline"></ion-icon> Confirm
            </button>
            <button class="btn-pending-order" onclick="updateStatus(${o.id}, 'pending')">
                <ion-icon name="time-outline"></ion-icon> Set Pending
            </button>
            <button class="btn-cancel-order"  onclick="updateStatus(${o.id}, 'cancelled')">
                <ion-icon name="close-circle-outline"></ion-icon> Cancel
            </button>
            <span class="status-update-msg" id="statusMsg"></span>
        </div>
    `;
}

// ── UPDATE STATUS ────────────────────────────────────────
async function updateStatus(id, status) {
    const msg = document.getElementById('statusMsg');
    if (msg) { msg.className = 'status-update-msg'; msg.textContent = ''; }

    try {
        const res  = await fetch(`${API}?action=update_status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id, status })
        });
        const data = await res.json();

        if (data.success) {
            // Update badge inside modal
            const badge = document.getElementById('modalStatusBadge');
            if (badge) badge.innerHTML = statusBadge(status);
            if (msg) { msg.className = 'status-update-msg success'; msg.textContent = `✓ Status updated to ${status}`; }
            toast(`Order ${padId(id)} marked as ${status}`);
            loadOrders(currentPage); // refresh table behind modal
        } else {
            if (msg) { msg.className = 'status-update-msg error'; msg.textContent = data.error || 'Update failed'; }
            toast(data.error || 'Update failed', true);
        }
    } catch (e) {
        if (msg) { msg.className = 'status-update-msg error'; msg.textContent = 'Network error'; }
        toast('Network error', true);
    }
}

// ── SEARCH DEBOUNCE ──────────────────────────────────────
document.getElementById('searchInput').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => loadOrders(1), 420);
});
document.getElementById('statusFilter').addEventListener('change', () => loadOrders(1));
document.getElementById('sortOrder').addEventListener('change',   () => loadOrders(1));

// ── XSS HELPER ───────────────────────────────────────────
function escHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ── INIT ─────────────────────────────────────────────────
loadOrders(1);
setInterval(() => loadOrders(currentPage), 60000);
</script>
